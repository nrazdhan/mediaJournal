            button {

            }
            .video-display {
                width: 100%;
                height: auto;
                aspect-ratio: 9 / 16;
                object-fit: cover;
                display: block;
            }

        <style>
            .color-slider-wrapper {
                width: 100%;
                margin-top: 1px;
                overflow: hidden;
            }
            .product-options {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                margin: 1px 0;
            }
            .product-options .color-slider-wrapper {
                flex: 1;
            }
            .size-options {
                display: flex;
                align-items: center;
                gap: 3px;
                flex-shrink: 0;
            }
            .size-option {
                appearance: none;
                -webkit-appearance: none;
                width: 22px;
                height: 22px;
                border: 1px solid #999;
                border-radius: 4px;
                background: #fff;
                color: #333;
                cursor: pointer;
                position: relative;
            }
            .size-option::after {
                content: attr(aria-label);
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                font-size: 11px;
                font-weight: bold;
            }
            .size-option:checked {
                background: #333;
                border-color: #333;
                color: #fff;
            }
            .color-slider {
                display: flex;
                gap: 1px;
                overflow-x: auto;
                padding: 0px 0px;
                scroll-behavior: smooth;
                -webkit-overflow-scrolling: touch;
            }
            .color-slider::-webkit-scrollbar {
                display: none;
            }

            .color-dot {
                 appearance: none; /* Removes the ugly standard browser radio dot */
                -webkit-appearance: none;
                width: 20px;
                height: 20px;
                border-radius: 50%;
                cursor: pointer;
                box-shadow: inset 0 0 0 2px rgba(0,0,0,0.1); /* Subtle inner edge */
                transition: all 0.2s ease;
                margin-bottom: 2px;

                /* width: 1px;
                height: 1px;
                border-radius: 10%;
                border: 2px solid #ccc;
                flex-shrink: 0;
                cursor: pointer;
                transition: transform 0.2s ease, border-color 0.2s ease; */
            }
            .color-dot:checked {
                transform: scale(0.85); /* Physically shrinks down to look pressed */
                box-shadow: 0 0 0 3px #333; /* Adds a heavy, dark "selected" ring around it */
            }
            .color-dot:active {
                transform: scale(2.0);
            }
            .red { background-color: #af3232; }
            .blue { background-color: #2984e6; }
            .white { background-color: #ffffff; border-color: #999; }
            .green { background-color: #2fa148; }
            .yellow { background-color: #ffc107; }
            .purple { background-color: #6f42c1; }
            .black { background-color: #000000; }
        </style>

        <script>
            const RAZORPAY_KEY_ID = "rzp_test_TVAru2oomiEBEz";
            let selectedProductId=null;
            let selectedColor=null;
            let selectedSize=null;

            function buyProduct(button){
                const productCard = button.closest(".video-div-tag");
                const selectedColorOption = productCard.querySelector(".color-dot:checked");
                const selectedSizeOption = productCard.querySelector(".size-option:checked");
                const id = button.id; // Get the ID of the clicked button
                showCheckoutForm(id, selectedColorOption?.classList[1] || null, selectedSizeOption?.value || null);
            }

            //step 2a: user clicks buy now
            function showCheckoutForm(productId, color, size){
                selectedProductId=productId;
                selectedColor=color;
                selectedSize=size;
                document.getElementById("selling-point").style.display="none";
                document.getElementById("checkout-form-div").style.display="block";
            }

            async function processOrderCreation(event){

                event.preventDefault(); // Prevent the form from submitting normally

                const submitButton = document.querySelector("#checkout-form-details button");
                submitButton.disabled = true;
                submitButton.textContent = "Processing...";

                try {
                    const customerData = {
                        "productId": selectedProductId,
                        "color": selectedColor,
                        "size": selectedSize,
                        "fullName": document.getElementById("fullName").value,
                        "email": document.getElementById("email").value,
                        "phone": document.getElementById("phone").value,
                        "addressLine1": document.getElementById("addressLine1").value,
                        "addressLine2": document.getElementById("addressLine2").value,
                        "city": document.getElementById("city").value,
                        "state": document.getElementById("state").value,
                        "zipCode": document.getElementById("zipCode").value,
                        "country": document.getElementById("country").value
                    }

                    const orderResponse = await fetch("/create-order",
                        {
                            "headers": {
                                "Content-Type": "application/json"
                            },
                            "method": "POST",
                            "body": JSON.stringify(customerData)
                        }
                    );

                    const orderData = await orderResponse.json();

                    if(!orderResponse.ok){
                        switch(orderResponse.status) {
                            case 400:
                                throw new Error(orderData.error || "Bad Request");
                                break;
                            case 403:
                                throw new Error("You are not authrorized to create order");
                                break;
                            case 500:
                                throw new Error("Seomthing went wrong on the server. Please try again later.");
                                break;
                            default:
                                throw new Error(orderData.error || "unknown error occurred while creating order");
                                break;
                        }
                    }
                    initializeEmbeddedPayment(orderData, customerData);
                } catch(error) {
                    alert("Error creating order: " + error.message);
                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent = "Proceed to Payment";
                }
            }

            function initializeEmbeddedPayment(orderData, orderRequest){

                document.getElementById('checkout-form-div').style.display = 'none';
                document.getElementById('payment-container').style.display = 'block';
    
                const options = {
                    "name": "razdhan.store",
                    "description": "Testing Razor Pay",
                    "order_id": orderData.id,
                    "amount": orderData.amount,
                    "currency": orderData.currency,
                    "key": RAZORPAY_KEY_ID,

                    // CRUCIAL FOR EMBEDDING: Tell Razorpay where to inject the UI
                    "container": "#razorpay-embed-holder", 

                    "handler": async function(paymentResponse){
                        const paymentId = paymentResponse.razorpay_payment_id;
                        const orderId = paymentResponse.razorpay_order_id;
                        const signature = paymentResponse.razorpay_signature;

                        // statusMsg.innerText = "Verifying payment security...";

                        //3. Verify payment 
                        const verifyResponse = await fetch("/verify-payment", {
                            "method": "POST",
                            "headers": {
                                "Content-Type": "application/json"
                            },
                            "body": JSON.stringify({
                                "paymentId": paymentId,
                                "orderId": orderId,
                                "signature": signature
                            })
                        });

                        const verifyData = await verifyResponse.json();

                        if(verifyResponse.ok && verifyData.status==="success"){
                            document.getElementById("payment-container").style.display="none";
                            document.getElementById("success-screen").style.display="block";
                            const eres = await sendEmail(orderData, orderRequest, paymentId);
                            const eresjson = eres.json();
                        } else {
                            // statusMsg.style.color = "red";
                            // statusMsg.innerText = "Payment verification failed";
                            alert("Error:" + verifyData.message);
                        }
                    },
                    "prefill": {
                        "name": document.getElementById("fullName").value,
                        "email": document.getElementById("email").value,
                        "phone": document.getElementById("phone").value
                    },
                    "theme": {
                        "color": "#3399cc"
                    },
                    "modal": {
                        "ondismiss": function() {
                            statusMsg.style.color="orange";
                            statusMsg.innerText = "Payment cancelled by user";
                        }
                    }
                }

                //4. Open razorpay checkout interfaces
                const razorPay = new Razorpay(options);
                razorPay.open();
            }

            async function sendEmail(orderData, orderRequest, paymentId) {
                try{
                    const emailData = {
                        "orderRequest": orderRequest,
                        "orderId": orderData.id,
                        "paymentId": paymentId,
                        "amountInPaise": orderData.amount,
                        "currency": orderData.currency
                    }
                    const emailResponse = await fetch("/email-order-confirmation", {
                        "method": "POST",
                        "headers": {
                            "Content-Type": "application/json"
                        },
                        "body": JSON.stringify(emailData)
                    });
                    const emailResponseJson = await emailResponse.json();
                } catch(error) {
                    // swallow the exception, will need manual intervention by checking db for unconfirmed email sends.
                }
            }

            function returnToSellingPoint(){
                document.getElementById("success-screen").style.display="none";
                document.getElementById("selling-point").style.display="block";

                //Clear the customer detail fields
                document.getElementById("fullName").value="";
                document.getElementById("addressLine1").value="";
                document.getElementById("addressLine2").value="";
                document.getElementById("city").value="";
                document.getElementById("state").value="";
                document.getElementById("zipCode").value="";
                document.getElementById("phone").value="";
                document.getElementById("email").value="";
            }

            function changeColor(color) {
                alert("Selected color:" + color);
            }
        </script>
